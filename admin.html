<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — MONARCH</title>

    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body data-page="admin">

    <!-- ===== Sign in ===== -->
    <div class="adm-gate" id="admGate" hidden>
        <form class="adm-login" id="admLoginForm" novalidate>
            <img src="images/logo.webp" alt="MONARCH" width="150">
            <h1>Control panel</h1>

            <div class="field">
                <label for="admEmail">Email</label>
                <input type="email" id="admEmail" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="admPass">Password</label>
                <div class="adm-pass">
                    <input type="password" id="admPass" autocomplete="current-password" required>
                    <button type="button" class="adm-eye" id="admPassToggle"
                            aria-label="Show password" aria-pressed="false">
                        <svg class="adm-eye-on" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3.2"/>
                        </svg>
                        <svg class="adm-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.6-6.5 10-6.5c1.8 0 3.4.5 4.7 1.2M22 12s-3.6 6.5-10 6.5c-1.9 0-3.5-.5-4.9-1.3"/>
                            <path d="M9.9 9.9a3.2 3.2 0 0 0 4.3 4.3"/>
                            <path d="M3.5 3.5l17 17"/>
                        </svg>
                    </button>
                </div>
            </div>

            <p class="adm-error" id="admLoginError" role="alert" hidden></p>

            <button type="submit" class="btn btn-block" id="admLoginBtn">Sign in</button>
        </form>
    </div>

    <!-- ===== Panel ===== -->
    <div class="adm" id="admPanel" hidden>
        <header class="adm-head">
            <img src="images/logo.webp" alt="MONARCH" width="120">
            <nav class="adm-tabs" id="admTabs" aria-label="Sections">
                <button type="button" data-tab="appointments" class="is-active">Bookings</button>
                <button type="button" data-tab="orders">Orders</button>
                <button type="button" data-tab="barbers">Barbers</button>
                <button type="button" data-tab="gallery">Gallery</button>
                <button type="button" data-tab="services">Services</button>
                <button type="button" data-tab="products">Products</button>
            </nav>
            <div class="adm-who">
                <span id="admEmailLabel"></span>
                <button type="button" class="adm-ghost" id="admLogout">Sign out</button>
            </div>
        </header>

        <main class="adm-body">

            <!-- ---- Appointments ---- -->
            <section class="adm-tabpanel is-active" data-panel="appointments">
                <div class="adm-toolbar">
                    <input type="search" id="apSearch" placeholder="Search by name, phone or service">
                    <input type="date" id="apDate" aria-label="Date">
                    <select id="apStatus" aria-label="Status">
                        <option value="">All statuses</option>
                        <option value="pending">Awaiting confirmation</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <button type="button" class="adm-ghost" id="apReset">Reset</button>
                </div>
                <div class="adm-table-wrap">
                    <table class="adm-table" id="apTable">
                        <thead>
                            <tr>
                                <th>Client</th><th>Phone</th><th>Service</th>
                                <th>Date</th><th>Time</th><th>Status</th><th></th>
                            </tr>
                        </thead>
                        <tbody id="apBody"></tbody>
                    </table>
                </div>
                <p class="adm-empty" id="apEmpty" hidden>No bookings yet.</p>
            </section>

            <!-- ---- Orders ---- -->
            <section class="adm-tabpanel" data-panel="orders">
                <div class="adm-toolbar">
                    <input type="search" id="orSearch" placeholder="Search by number, name, phone or city">
                    <select id="orStatus" aria-label="Status">
                        <option value="">All statuses</option>
                        <option value="pending">Awaiting confirmation</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="processing">Processing</option>
                        <option value="shipped">Shipped</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <select id="orMethod" aria-label="Delivery method">
                        <option value="">Pickup and delivery</option>
                        <option value="pickup">Pickup</option>
                        <option value="delivery">Delivery</option>
                    </select>
                    <button type="button" class="adm-ghost" id="orReset">Reset</button>
                </div>
                <div class="adm-cards adm-cards-order" id="ordersList"></div>
                <p class="adm-empty" id="orEmpty" hidden>No orders yet.</p>
            </section>

            <!-- ---- Barbers ---- -->
            <section class="adm-tabpanel" data-panel="barbers">
                <div class="adm-toolbar">
                    <button type="button" class="btn" id="barberNew">Add barber</button>
                </div>
                <div class="adm-cards" id="barbersList"></div>
            </section>

            <!-- ---- Gallery ---- -->
            <section class="adm-tabpanel" data-panel="gallery">
                <div class="adm-toolbar">
                    <label class="btn" for="galleryUpload">Upload photo</label>
                    <input type="file" id="galleryUpload" accept="image/*" multiple hidden>
                    <span class="adm-hint">JPEG, PNG, WebP or AVIF · up to 5 MB</span>
                </div>
                <div class="adm-cards adm-cards-photo" id="galleryList"></div>
            </section>

            <!-- ---- Services ---- -->
            <section class="adm-tabpanel" data-panel="services">
                <div class="adm-toolbar">
                    <button type="button" class="btn" id="serviceNew">Add service</button>
                </div>
                <div class="adm-cards" id="servicesList"></div>
            </section>

            <!-- ---- Products ---- -->
            <section class="adm-tabpanel" data-panel="products">
                <div class="adm-toolbar">
                    <button type="button" class="btn" id="productNew">Add product</button>
                    <select id="prCat" aria-label="Category">
                        <option value="">All categories</option>
                        <option value="styling">Styling</option>
                        <option value="beard">Beard</option>
                        <option value="care">Care</option>
                        <option value="tools">Tools</option>
                        <option value="gift">Gifts</option>
                    </select>
                    <span class="adm-hint">The price set here is the one the server charges</span>
                </div>
                <div class="adm-cards" id="productsList"></div>
            </section>

        </main>
    </div>

    <!-- ===== Editor ===== -->
    <div class="adm-modal" id="admModal" hidden>
        <div class="adm-modal-panel" role="dialog" aria-modal="true" aria-labelledby="admModalTitle">
            <header>
                <h2 id="admModalTitle"></h2>
                <button type="button" class="adm-ghost" id="admModalClose" aria-label="Close">✕</button>
            </header>
            <form id="admModalForm" novalidate></form>
            <footer>
                <p class="adm-error" id="admModalError" role="alert" hidden></p>
                <button type="button" class="adm-ghost" id="admModalCancel">Cancel</button>
                <button type="submit" class="btn" form="admModalForm" id="admModalSave">Save</button>
            </footer>
        </div>
    </div>

    <div class="adm-toast" id="admToast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="admin.js"></script>
</body>

</html>
